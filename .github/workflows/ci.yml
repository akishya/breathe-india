name: CI & Container Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Build & Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production client bundle
        run: npm run build

      - name: Verify Docker image build
        run: docker build -t breathe-india:ci .
